<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing Page</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f6fa;
        }

        .navbar {
            background-color: #212529;
        }

        .product-card {
            transition: transform 0.3s;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            height: 220px;
            object-fit: contain;
            padding: 15px;
            background: white;
        }

        .price {
            color: #198754;
            font-size: 21px;
            font-weight: bold;
        }

        .filter-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                MyStore
            </a>

            <span class="text-white">
                Product List
            </span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-5">

        <h2 class="text-center mb-4">All Types Products</h2>

        <!-- Filters -->
        <div class="filter-section shadow-sm mb-4">
            <div class="row g-3">

                <!-- Search -->
                <div class="col-md-4">
                    <label for="searchInput" class="form-label">
                        Search Product
                    </label>

                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Enter product name..."
                    >
                </div>

                <!-- Category -->
                <div class="col-md-3">
                    <label for="categoryFilter" class="form-label">
                        Category
                    </label>

                    <select id="categoryFilter" class="form-select">
                        <option value="all">All Categories</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Shoes">Shoes</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>

                <!-- Maximum Price -->
                <div class="col-md-2">
                    <label for="priceFilter" class="form-label">
                        Maximum Price ($)
                    </label>

                    <input
                        type="number"
                        id="priceFilter"
                        class="form-control"
                        min="0"
                        placeholder="e.g. 100"
                    >
                </div>

                <!-- Sorting -->
                <div class="col-md-3">
                    <label for="sortFilter" class="form-label">
                        Sort By
                    </label>

                    <select id="sortFilter" class="form-select">
                        <option value="default">Default</option>
                        <option value="low">Price: Low to High</option>
                        <option value="high">Price: High to Low</option>
                        <option value="name">Name: A to Z</option>
                    </select>
                </div>

                <div class="col-12">
                    <button
                        class="btn btn-dark"
                        id="resetButton"
                        type="button"
                    >
                        Reset Filters
                    </button>
                </div>

            </div>
        </div>

        <!-- Product Count -->
        <p id="productCount" class="text-muted"></p>

        <!-- Product Cards -->
        <div class="row g-4" id="productContainer"></div>

    </div>

    <!-- JavaScript -->
    <script>
        // Product Data
        const products = [
            {
                id: 1,
                name: "Wireless Headphones",
                category: "Electronics",
                price: 80,
                image: "head.jpeg",
                description: "Enjoy clear sound and wireless freedom."
            },
            {
                id: 2,
                name: "Smart Watch",
                category: "Electronics",
                price: 120,
                image: "wach.jpeg",
                description: "Track your daily activity and notifications."
            },
            {
                id: 3,
                name: "Classic T-Shirt",
                category: "Clothing",
                price: 25,
                image: "shirt.jpeg",
                description: "A comfortable shirt for everyday wear."
            },
            {
                id: 4,
                name: "Running Shoes",
                category: "Shoes",
                price: 65,
                image: "Shoes.jpeg",
                description: "Lightweight shoes for everyday activities."
            },
            {
                id: 5,
                name: "Leather Wallet",
                category: "Accessories",
                price: 35,
                image: "wallet.jpeg",
                description: "Keep your essentials organized."
            },
            {
                id: 6,
                name: "Bluetooth Speaker",
                category: "Electronics",
                price: 55,
                image: "speaker.jpeg",
                description: "Enjoy your favorite music anywhere."
            },
            {
                id: 7,
                name: "Denim Jacket",
                category: "Clothing",
                price: 70,
                image: "Jacket.jpeg",
                description: "A versatile jacket for casual outfits."
            },
            {
                id: 8,
                name: "Casual Sneakers",
                category: "Shoes",
                price: 45,
                image: "Sneakers2.jpeg",
                description: "Comfortable sneakers for daily use."
            }
        ];

        // Select HTML Elements
        const productContainer =
            document.getElementById("productContainer");

        const searchInput =
            document.getElementById("searchInput");

        const categoryFilter =
            document.getElementById("categoryFilter");

        const priceFilter =
            document.getElementById("priceFilter");

        const sortFilter =
            document.getElementById("sortFilter");

        const productCount =
            document.getElementById("productCount");

        const resetButton =
            document.getElementById("resetButton");

        // Display Products Using Template Literals
        function displayProducts(productList) {

            productCount.textContent =
                `${productList.length} product(s) found`;

            if (productList.length === 0) {
                productContainer.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <h4>No products found!</h4>
                        <p class="text-muted">
                            Try changing your search or filters.
                        </p>
                    </div>
                `;
                return;
            }

            productContainer.innerHTML = productList.map(product => `
                <div class="col-sm-6 col-lg-3">
                    <div class="card product-card shadow-sm border-0">

                        <img
                            src="${product.image}"
                            class="card-img-top product-image"
                            alt="${product.name}"
                        >

                        <div class="card-body d-flex flex-column">

                            <span class="badge bg-secondary align-self-start mb-2">
                                ${product.category}
                            </span>

                            <h5 class="card-title">
                                ${product.name}
                            </h5>

                            <p class="card-text text-muted">
                                ${product.description}
                            </p>

                            <p class="price mt-auto">
                                $${product.price.toFixed(2)}
                            </p>

                            <button
                                class="btn btn-dark w-100"
                                type="button"
                                onclick="showProduct(${product.id})"
                            >
                                View Product
                            </button>

                        </div>
                    </div>
                </div>
            `).join("");
        }

        // Advanced Filtering Method
        function filterProducts() {

            const searchText =
                searchInput.value.trim().toLowerCase();

            const selectedCategory =
                categoryFilter.value;

            const maxPrice =
                priceFilter.value === ""
                    ? Infinity
                    : Number(priceFilter.value);

            // Filter products based on multiple conditions
            let filteredProducts = products.filter(product => {

                const matchesName =
                    product.name.toLowerCase().includes(searchText);

                const matchesCategory =
                    selectedCategory === "all" ||
                    product.category === selectedCategory;

                const matchesPrice =
                    product.price <= maxPrice;

                return matchesName &&
                       matchesCategory &&
                       matchesPrice;
            });

            // Sort Filtered Products
            if (sortFilter.value === "low") {
                filteredProducts.sort((a, b) => a.price - b.price);
            } else if (sortFilter.value === "high") {
                filteredProducts.sort((a, b) => b.price - a.price);
            } else if (sortFilter.value === "name") {
                filteredProducts.sort((a, b) =>
                    a.name.localeCompare(b.name)
                );
            }

            displayProducts(filteredProducts);
        }

        // View Product Details
        function showProduct(productId) {

            const product = products.find(
                item => item.id === productId
            );

            if (product) {
                alert(
                    `Product: ${product.name}\n` +
                    `Category: ${product.category}\n` +
                    `Price: $${product.price.toFixed(2)}\n` +
                    `Description: ${product.description}`
                );
            }
        }

        // Filter When User Changes Inputs
        searchInput.addEventListener("input", filterProducts);

        categoryFilter.addEventListener("change", filterProducts);

        priceFilter.addEventListener("input", filterProducts);

        sortFilter.addEventListener("change", filterProducts);

        // Reset All Filters
        resetButton.addEventListener("click", function () {

            searchInput.value = "";
            categoryFilter.value = "all";
            priceFilter.value = "";
            sortFilter.value = "default";

            filterProducts();
        });

        // Show All Products Initially
        displayProducts(products);
    </script>

</body>
</html>
